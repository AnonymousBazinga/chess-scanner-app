<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#161512">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="description" content="Take a photo of a real chessboard and analyze the position with Stockfish. AI board recognition with private, in-memory photo processing.">
  <title>Chess Scanner</title>
  <link rel="icon" href="icon-1024.png">
  <link rel="apple-touch-icon" href="icon-1024.png">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="styles.css">
  <script type="module" src="js/app.js"></script>
</head>
<body>
  <div id="app">

    <!-- Scan -->
    <section class="view" id="view-scan" data-active>
      <header class="scan-top">
        <button class="round-btn" id="btn-history" aria-label="History" data-testid="scan-history">
          <svg viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 3-6.7M3 4v5h5M12 7v5l3 2"/></svg>
        </button>
        <h1>Chess Scanner</h1>
        <span class="round-btn placeholder"></span>
      </header>

      <div class="viewfinder" id="viewfinder">
        <video id="camera" playsinline muted autoplay></video>
        <img id="scan-photo" alt="">
        <div class="camera-off" id="camera-off">
          <svg viewBox="0 0 24 24"><path d="M3 8V6a2 2 0 0 1 2-2h2M17 4h2a2 2 0 0 1 2 2v2M21 16v2a2 2 0 0 1-2 2h-2M7 20H5a2 2 0 0 1-2-2v-2"/><circle cx="12" cy="12" r="3.2"/></svg>
          <strong>Camera unavailable</strong>
          <span>Choose a photo of your board instead.</span>
        </div>
        <div class="brackets"><i></i><i></i><i></i><i></i></div>
        <div class="scan-overlay" aria-hidden="true">
          <svg class="scan-grid" viewBox="0 0 80 80">
            <path d="M10 0v80 M0 10h80" style="--i:0"/>
            <path d="M20 0v80 M0 20h80" style="--i:1"/>
            <path d="M30 0v80 M0 30h80" style="--i:2"/>
            <path d="M40 0v80 M0 40h80" style="--i:3"/>
            <path d="M50 0v80 M0 50h80" style="--i:4"/>
            <path d="M60 0v80 M0 60h80" style="--i:5"/>
            <path d="M70 0v80 M0 70h80" style="--i:6"/>
          </svg>
          <div class="scan-sweep"></div>
          <span class="scan-badge"><i></i> SCANNING</span>
        </div>
      </div>

      <div class="scan-status">
        <p class="hint" id="scan-hint" role="status">Fit the whole board inside the frame</p>
        <p class="scan-detail" id="scan-detail" hidden></p>
      </div>

      <div class="scan-controls">
        <label class="side-btn" data-testid="scan-gallery">
          <input type="file" accept="image/*" id="file-input" hidden>
          <span class="side-icon"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><circle cx="9" cy="10" r="1.6"/><path d="m21 16-5-5-8 8"/></svg></span>
          <span>Photos</span>
        </label>
        <button class="shutter" id="btn-shutter" aria-label="Take photo" data-testid="scan-shutter"><span></span></button>
        <button class="side-btn" id="btn-manual" data-testid="scan-manual">
          <span class="side-icon"><svg viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="2"/><path d="M4 9.3h16M4 14.7h16M9.3 4v16M14.7 4v16"/></svg></span>
          <span>Set up</span>
        </button>
      </div>
    </section>

    <!-- Editor -->
    <section class="view" id="view-editor">
      <header class="nav">
        <button class="nav-btn" data-back aria-label="Back"><svg viewBox="0 0 24 24"><path d="m15 5-7 7 7 7"/></svg></button>
        <h2>Review Position</h2>
        <div class="nav-group">
          <button class="nav-btn" id="btn-undo" aria-label="Undo" data-testid="editor-undo" disabled><svg viewBox="0 0 24 24"><path d="M9 14 4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11"/></svg></button>
          <button class="nav-btn" id="btn-editor-menu" aria-label="More" data-testid="editor-menu"><svg viewBox="0 0 24 24"><circle cx="5" cy="12" r="1.2"/><circle cx="12" cy="12" r="1.2"/><circle cx="19" cy="12" r="1.2"/></svg></button>
        </div>
      </header>
      <div class="scroll">
        <div class="board-wrap"><div id="editor-board"></div></div>
        <div class="tray" id="tray"></div>
        <p class="card muted" id="scan-review" hidden></p>
        <div class="card row">
          <span class="muted">To move</span>
          <div class="segmented" id="side-toggle">
            <button data-side="w" data-testid="side-white"><i class="dot white"></i>White</button>
            <button data-side="b" data-testid="side-black"><i class="dot black"></i>Black</button>
          </div>
        </div>
      </div>
      <footer class="action-bar">
        <button class="thumb" id="btn-photo" aria-label="Compare with photo" hidden><img id="editor-thumb" alt=""></button>
        <button class="primary" id="btn-analyze" data-testid="editor-analyze">Analyze</button>
      </footer>
    </section>

    <!-- Analysis -->
    <section class="view" id="view-analysis">
      <header class="nav">
        <button class="nav-btn" data-back aria-label="Back"><svg viewBox="0 0 24 24"><path d="m15 5-7 7 7 7"/></svg></button>
        <h2>Analysis</h2>
        <button class="nav-btn" id="btn-analysis-menu" aria-label="More" data-testid="analysis-menu"><svg viewBox="0 0 24 24"><circle cx="5" cy="12" r="1.2"/><circle cx="12" cy="12" r="1.2"/><circle cx="19" cy="12" r="1.2"/></svg></button>
      </header>
      <div class="scroll">
        <div class="card engine">
          <div class="engine-head">
            <span class="engine-name">Stockfish 19</span>
            <span class="engine-depth" id="engine-depth" data-testid="engine-depth" data-depth="0"></span>
            <label class="switch"><input type="checkbox" id="engine-toggle" checked data-testid="engine-toggle"><span></span></label>
          </div>
          <div class="engine-lines" id="engine-lines"></div>
        </div>
        <div class="player top" id="player-top"></div>
        <div class="analysis-board">
          <div class="eval-bar" id="eval-bar" data-testid="eval-bar"><div class="eval-fill" id="eval-fill"></div><span id="eval-text"></span></div>
          <div class="board-wrap"><div id="analysis-board"></div></div>
        </div>
        <div class="player bottom" id="player-bottom"></div>
        <div class="moves" id="moves"></div>
        <div class="open-in">
          <span class="muted">Open in</span>
          <a class="chip-link" id="open-chesscom" target="_blank" rel="noopener" data-testid="open-chesscom">Chess.com</a>
          <a class="chip-link" id="open-lichess" target="_blank" rel="noopener" data-testid="open-lichess">Lichess</a>
        </div>
      </div>
      <footer class="controls">
        <button class="ctl" id="btn-flip" aria-label="Flip board" data-testid="analysis-flip"><svg viewBox="0 0 24 24"><path d="M7 4v16M3 8l4-4 4 4M17 20V4M13 16l4 4 4-4"/></svg></button>
        <button class="ctl" id="btn-first" aria-label="First move"><svg viewBox="0 0 24 24"><path d="M6 5v14M18 5l-8 7 8 7z"/></svg></button>
        <button class="ctl wide" id="btn-back" aria-label="Previous move" data-testid="analysis-back"><svg viewBox="0 0 24 24"><path d="m15 5-7 7 7 7"/></svg></button>
        <button class="ctl wide" id="btn-forward" aria-label="Next move" data-testid="analysis-forward"><svg viewBox="0 0 24 24"><path d="m9 5 7 7-7 7"/></svg></button>
        <button class="ctl" id="btn-last" aria-label="Last move"><svg viewBox="0 0 24 24"><path d="M18 5v14M6 5l8 7-8 7z"/></svg></button>
      </footer>
    </section>

    <!-- History sheet -->
    <div class="sheet" id="sheet-history" hidden>
      <div class="sheet-panel">
        <header class="nav">
          <button class="text-btn" data-close>Done</button>
          <h2>History</h2>
          <button class="text-btn danger" id="btn-clear-history">Clear</button>
        </header>
        <div class="history-list" id="history-list"></div>
        <button class="about-link" id="btn-about">About &amp; acknowledgements</button>
      </div>
    </div>

    <!-- About sheet -->
    <div class="sheet" id="sheet-about" hidden>
      <div class="sheet-panel">
        <header class="nav">
          <button class="text-btn" data-close>Done</button>
          <h2>About</h2>
          <span class="text-btn placeholder"></span>
        </header>
        <div class="about">
          <p class="lead" id="scan-privacy">Photos are sent securely to the scanner, processed in memory and not stored.</p>
          <ul id="credits"></ul>
        </div>
      </div>
    </div>

    <div class="menu" id="menu" hidden></div>
    <div class="photo-full" id="photo-full" hidden><img id="photo-full-img" alt=""></div>
    <div class="promotion" id="promotion" hidden><div class="promotion-panel" id="promotion-panel"></div></div>
    <div class="toast" id="toast" hidden></div>
  </div>
</body>
</html>
