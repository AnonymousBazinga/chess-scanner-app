name: App Store screenshots

on:
  workflow_dispatch:
  push:
    paths:
      - ChessScannerUITests/AppStoreScreenshots.swift
      - .github/workflows/store-screenshots.yml

permissions:
  contents: write

jobs:
  screenshots:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Fetch models
        run: scripts/fetch_models.sh

      - name: Generate Xcode project
        run: |
          brew list xcodegen >/dev/null 2>&1 || brew install xcodegen
          xcodegen generate

      # 6.9" screenshots (1320x2868) are the only size App Store Connect requires
      # for iPhone; it scales them for smaller devices.
      - name: Boot a Pro Max simulator with a clean status bar
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          devices = json.load(sys.stdin)["devices"]
          ios = sorted((r for r in devices if "iOS" in r), key=lambda r: [int(p) for p in r.split("iOS-")[1].split("-")])
          phones = [d for d in devices[ios[-1]] if d["name"].startswith("iPhone") and "Pro Max" in d["name"]]
          print(sorted(phones, key=lambda d: d["name"])[-1]["udid"])')
          echo "SIM_UDID=$UDID" >> "$GITHUB_ENV"
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl status_bar "$UDID" override --time "9:41" --dataNetwork wifi --wifiMode active \
            --wifiBars 3 --cellularMode active --cellularBars 4 --batteryState charged --batteryLevel 100
          xcrun simctl list devices | grep "$UDID"

      - name: Capture screenshots
        run: |
          set -o pipefail
          TEST_RUNNER_STORE_SCREENSHOTS=1 xcodebuild test \
            -project ChessScanner.xcodeproj -scheme ChessScanner \
            -destination "id=$SIM_UDID" \
            -only-testing:ChessScannerUITests/AppStoreScreenshots \
            -resultBundlePath build/Store.xcresult \
            CODE_SIGNING_ALLOWED=NO \
            | tee build.log | grep -E "error:|Test Case|Executed|\*\* TEST" || true
          grep -q "\*\* TEST SUCCEEDED \*\*" build.log

      - name: Export and publish
        if: always()
        run: |
          mkdir -p build/raw build/store
          xcrun xcresulttool export attachments --path build/Store.xcresult --output-path build/raw || true
          python3 - <<'PY'
          import json, pathlib, shutil
          raw = pathlib.Path("build/raw")
          for test in json.loads((raw / "manifest.json").read_text()):
              for att in test["attachments"]:
                  name = att.get("suggestedHumanReadableName", "")
                  if name.startswith("store-"):
                      dest = pathlib.Path("build/store") / (name.split("_")[0] + ".png")
                      shutil.copy(raw / att["exportedFileName"], dest)
                      print(dest)
          PY
          sips -g pixelWidth -g pixelHeight build/store/*.png || true
          cd build/store
          git init -q
          git add -A
          git -c user.name="iOS QA" -c user.email="qa@users.noreply.github.com" \
            commit -qm "Store screenshots for ${GITHUB_SHA::7} (run ${GITHUB_RUN_ID})"
          git push -qf "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:refs/qa/store-screenshots
        env:
          GH_TOKEN: ${{ github.token }}
