name: ChessScanner
options:
  bundleIdPrefix: com.chessscanner
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "15.0"

settings:
  SWIFT_VERSION: "6.0"
  GENERATE_INFOPLIST_FILE: true
  SWIFT_STRICT_CONCURRENCY: minimal

packages:
  ChessKitEngine:
    url: https://github.com/chesskit-app/chesskit-engine.git
    from: "0.5.0"

targets:
  ChessScanner:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: ChessScanner
        excludes:
          - Resources/Info.plist
    dependencies:
      - package: ChessKitEngine
    info:
      path: ChessScanner/Resources/Info.plist
      properties:
        CFBundleDisplayName: Chess Scanner
        UILaunchScreen: {}
        NSCameraUsageDescription: "Chess Scanner needs camera access to photograph chess boards for position analysis."
        NSPhotoLibraryUsageDescription: "Chess Scanner needs photo library access to import chess board images for analysis."
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.chessscanner.app
      PRODUCT_NAME: Chess Scanner
      MARKETING_VERSION: "1.0"
      CURRENT_PROJECT_VERSION: "1"
      INFOPLIST_FILE: ChessScanner/Resources/Info.plist
      SWIFT_EMIT_LOC_STRINGS: true
      ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      TARGETED_DEVICE_FAMILY: "1"

  ChessScannerUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: ChessScannerUITests
        excludes:
          - "Fixtures/**"
    dependencies:
      - target: ChessScanner
    settings:
      GENERATE_INFOPLIST_FILE: true
      PRODUCT_BUNDLE_IDENTIFIER: com.chessscanner.app.uitests
      SWIFT_VERSION: "5.0"
      TEST_TARGET_NAME: ChessScanner

schemes:
  ChessScanner:
    build:
      targets:
        ChessScanner: all
        ChessScannerUITests: [test]
    test:
      targets:
        - ChessScannerUITests
